dataset_path: musdb18/processed
channels: 1
sr: 44100
crop_length: 261632
batch_size: 8
epoch_size: 500
val_crops_per_track: 15
val_size: 0.14
silence_threshold: 1e-3
max_retries: 50
num_workers: 4
random_seed: 42
split_path: musdb18/split.json
# Training augmentations (MUSDBTrainDataset), all off by default; validation is never augmented.
remix: false          # accompaniment from another track, independent offset
gain: false           # per-source gain, uniform in [gain_low, gain_high]
gain_low: 0.25        # Open-Unmix _augment_gain defaults
gain_high: 1.25
channel_swap: false   # per-source L/R swap with p = 0.5 (needs channels: 2)
