in_channels: ${data.channels}
base_channels: 16
depth: 6
n_fft: 2048
hop_length: 512
learning_rate: 0.001
input_transform: none   # none | log1p | sqrt | norm
input_power: 0.3        # exposant quand input_transform=power
loss_power: 1.0         # exposant de compression de la loss (1.0 = L1 linéaire, baseline)
loss_type: amp_l1       # amp_l1 | sisdr | wsdr | mrstft (loss sur la forme d'onde : voir utils/losses.py)
scheduler: none         # none (lr constant) | cosine (décroissance en cosinus jusqu'à 0 sur tout l'entraînement, sans redémarrage)
