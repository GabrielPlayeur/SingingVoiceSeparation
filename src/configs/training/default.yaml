max_epochs: 150
early_stopping_patience: 30   # null disables early stopping (fixed budget)
early_stopping_min_delta: 0.0 # dB
log_every_n_steps: 50
evaluate_at_end: true
checkpoint_every_n_epochs: null  # periodic checkpoints (periodic-epoch*-step*.ckpt, weights only, all kept), e.g. 100; null = none (disk)
