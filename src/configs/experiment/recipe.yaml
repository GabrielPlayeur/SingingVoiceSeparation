# @package _global_
# Recipe kept by phase 2 (experiments/10_recipe.md, `python -m analysis.convergence decide`), base of every run of phase 3
# (experiments/11_final.md): w16 stereo, budget B = 1000 epochs (experiments/09), no early stopping, last checkpoint evaluated.
# Filled on 17 Oct 2026 from `analysis.convergence decide` (figures/convergence_decide.json, experiments/10): augmentation kept
# (main effect +0.253 dB > threshold 0.145 dB), end decay not kept (+0.126 dB < 0.145 dB). Same recipe as probe_w16_aug.
data:
  channels: 2
  remix: true          # augmentation kept: the three flags go together, as in probe_w16_aug
  gain: true
  channel_swap: true
model:
  base_channels: 16
  scheduler: none     # constant lr: wsd not kept
training:
  max_epochs: 1000
  early_stopping_patience: null
  checkpoint_every_n_epochs: null
