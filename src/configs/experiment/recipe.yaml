# @package _global_
# Recipe kept by phase 2 (experiments/10_recipe.md, `python -m analysis.convergence decide`), base of every run of phase 3
# (experiments/11_final.md): w16 stereo, budget B = 1000 epochs (experiments/09), no early stopping, last checkpoint evaluated.
# The ${FILL_AFTER_PHASE_2} values are replaced by hand after the phase-2 decision. Until then every run fails at start-up:
# train.py resolves the whole config (WandbLogger) and the key does not exist (InterpolationKeyError). Not `???`: OmegaConf
# merges a missing value over the defaults without replacing them, so the run would silently start with no augmentation (tested).
data:
  channels: 2
  remix: ${FILL_AFTER_PHASE_2}          # true if augmentation is kept (the three flags go together, as in probe_w16_aug)
  gain: ${FILL_AFTER_PHASE_2}
  channel_swap: ${FILL_AFTER_PHASE_2}
model:
  base_channels: 16
  scheduler: ${FILL_AFTER_PHASE_2}      # none (constant lr) | wsd (constant then linear decay over the last 20 %)
training:
  max_epochs: 1000
  early_stopping_patience: null
  checkpoint_every_n_epochs: null
