# @package _global_
# Baseline optimisation: stereo, amplitude L1 loss, only the learning rate / scheduler changes (lr 1e-3 + cosine).
# Early stopping disabled: it would cut the cosine before the end of the decay (all the runs of this study: 150 epochs).
data:
  channels: 2
model:
  learning_rate: 0.001
  scheduler: cosine
training:
  early_stopping_patience: null
wandb:
  run_name: unet-stereo-cosine
