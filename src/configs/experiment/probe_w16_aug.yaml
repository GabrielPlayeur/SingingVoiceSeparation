# @package _global_
# Convergence probe (phase 1): stereo baseline (constant lr 1e-3, amplitude L1 loss), width 16, WITH training augmentation,
# 1000 epochs (63,000 steps) and no early stopping, to see where the validation curve plateaus (fixes the fixed budget B).
# The last checkpoint is the one to evaluate (queue entry `ckpt: last`). Weights-only checkpoint every 100 epochs (w16 only: disk).
data:
  channels: 2
  remix: true
  gain: true
  channel_swap: true
model:
  base_channels: 16
training:
  max_epochs: 1000
  early_stopping_patience: null
  checkpoint_every_n_epochs: 100
wandb:
  run_name: unet-probe-w16-aug
