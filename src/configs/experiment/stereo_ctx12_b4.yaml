# @package _global_
# Context length: stereo baseline (constant lr 1e-3, amplitude L1 loss), only the training CROP LENGTH changes:
# crop_length = 523776 samples (11.88 s) instead of 261632 (5.93 s). Depth 6 unchanged: 523776/512 + 1 frames, a multiple of 64
# (assert_no_temporal_padding). See experiments/07_context_length.md.
# CONTROL: batch 4 instead of 8 and 252 crops per epoch (63 steps, like the baseline): same number of steps AND same amount of audio
# per step as the baseline (4 x 11.88 s ≈ 8 x 5.93 s); only the crop length changes, not the amount of data seen.
data:
  channels: 2
  crop_length: 523776
  batch_size: 4
  epoch_size: 252
wandb:
  run_name: unet-stereo-ctx12_b4
