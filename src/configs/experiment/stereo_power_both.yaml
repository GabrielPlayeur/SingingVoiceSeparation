# @package _global_
# Stereo baseline + power law c = 0.3 on the input AND in the loss (the configuration of Wilson et al. 2018, except the mask,
# which is still applied to the linear amplitude).
data:
  channels: 2
model:
  input_transform: power
  input_power: 0.3
  loss_power: 0.3
wandb:
  run_name: unet-stereo-power-both
