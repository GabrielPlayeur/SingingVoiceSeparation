[project]
name = "singingvoiceseparation"
version = "0.7.5"
description = "Singing Voice Separation"
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "regex",
    "tqdm",
    "torch==2.10.0",
    "torchvision",
    "torchsummary",
    "librosa>=0.11.0",
    "lightning>=2.6.6",
    "wandb>=0.30.0",
    "hydra-core>=1.3.7",
    "imageio-ffmpeg>=0.6.0",
    "museval>=0.4.1",
    "stempeg>=0.2.6",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.uv]
package = false
